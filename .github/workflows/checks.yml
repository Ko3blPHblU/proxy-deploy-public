name: Installer checks
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan all fetched history for secrets
        run: |
          curl --fail --silent --show-error --location --retry 3 --max-time 120 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            -o "$RUNNER_TEMP/gitleaks.tar.gz"
          printf '%s  %s\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --redact --log-opts=--all
  offline-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax and static checks
        run: |
          bash -n deploy-proxy.sh
          shellcheck deploy-proxy.sh
      - name: Offline regression tests (no VPS deployment)
        run: python3 -m unittest discover -s . -p 'test_*.py' -v
  real-extra-clients:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install test host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nginx libnginx-mod-stream
          sudo systemctl stop nginx
      - name: Real NaiveProxy and XHTTP through Nginx with repeat and rollback
        run: sudo --preserve-env=GITHUB_ACTIONS python3 integration_extras.py
      - name: Sanitized diagnostics on failure
        if: failure()
        run: sudo cat /tmp/proxy-extras-ci.log
